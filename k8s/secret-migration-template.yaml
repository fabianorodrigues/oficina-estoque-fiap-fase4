# Template do Secret de migration do oficina-estoque.
# Secret separado do de aplicacao por decisao: um Secret unico servindo os dois
# workloads entregaria ao runtime a credencial que altera schema.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-estoque-database-migration
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: oficina-estoque
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: oficina
type: Opaque
data:
  ConnectionStrings__OficinaEstoqueDb: __MIGRATION_CONNECTION_STRING__