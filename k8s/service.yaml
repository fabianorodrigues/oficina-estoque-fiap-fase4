# Service NodePort do oficina-estoque.
# Sem Ingress Controller e sem ServiceLB: o Target Group do ALB registra a
# instancia diretamente nesta porta.
apiVersion: v1
kind: Service
metadata:
  name: oficina-estoque
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: oficina-estoque
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oficina
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: oficina-estoque
    app.kubernetes.io/component: api
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: __NODE_PORT__